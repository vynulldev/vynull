# SPDX-License-Identifier: GPL-3.0-or-later
#
# Build static Linux binaries (amd64 + arm64) and attach them to a GitHub
# Release whenever a version tag (v*) is pushed. The release is created as a
# DRAFT so you can review the notes and assets before publishing.
#
#   git tag v0.1.0 && git push origin v0.1.0
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: '0' # no cgo — fully static, portable binaries
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags='-s -w' -o vynull .
          tar -czf "vynull-${GITHUB_REF_NAME}-linux-${GOARCH}.tar.gz" vynull LICENSE README.md

      - uses: actions/upload-artifact@v4
        with:
          name: vynull-${{ matrix.goarch }}
          path: 'vynull-*.tar.gz'
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release (draft)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          draft: true
          generate_release_notes: true
